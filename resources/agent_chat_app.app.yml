resources:
  apps:
    agent_chat:
      name: agent-chat-${bundle.target}
      description: "Single-page Streamlit chat app over a LangChain agent on Databricks."
      source_code_path: ../app
      # The app authenticates as the logged-in user, so model calls are made
      # under that user's grants rather than the app's service principal.
      user_api_scopes:
        - model-serving
        - ai-gateway
        # What the forwarded user token needs to reach the Genie One MCP server
        # at /api/2.0/mcp/genie. The scope is `genie`, not `mcp.genie`: with only
        # the latter the endpoint answers 403 "Provided OAuth token does not have
        # required scopes: genie", and the agent falls back to running with no
        # Genie tools.
        - genie
      resources:
        - name: llm
          description: "Serving endpoint backing the agent."
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY
        # Conversation checkpoints and long-term memory. CAN_CONNECT_AND_CREATE
        # because the app's service principal creates — and therefore owns — the
        # memory schema on first start. Deploy before running locally, or your own
        # credentials own that schema and the service principal is locked out.
        - name: postgres
          description: "Lakebase project holding checkpoints and long-term memory."
          postgres:
            branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
            database: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
